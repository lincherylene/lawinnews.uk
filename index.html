<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Law in News</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dr+Sugiyama&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #eaeff3;
            color: #000000;
            padding: 40px 20px;
        }

        .header-container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        .main-heading {
            font-family: "Dr Sugiyama", cursive, serif;
            font-size: 80px;
            font-weight: 400;
            color: #000000;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            text-align: center;
        }

        .sub-heading {
            font-family: "Cormorant Garamond", serif;
            font-size: 20px;
            font-weight: 400;
            color: #000000;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="main-heading">law in news</h1>
        <p class="sub-heading">by cherylene lin</p>
    </div>

</body>
</html>
