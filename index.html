<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law in News</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .header-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            max-width: 550px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1e3a8a;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #475569;
            margin: 0;
            font-weight: 500;
            line-height: 1.5;
        }

        .arrow {
            color: #d97706;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-card">
        <h1>Law in News</h1>
        <p class="subtitle">Headlines <span class="arrow">&rarr;</span> Law; explained by students, for students.</p>
    </div>

</body>
</html>
