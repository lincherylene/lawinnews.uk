<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper rendering and touch zooming on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ensures compatibility with older Internet Explorer browsers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Centered Heading and Subheading</title>
    
    <style>
        /* CSS Reset to ensure consistent default margins and padding across all browsers */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Container to center-align the content responsively */
        body {
            /* Fallback fonts and modern system font stack ensuring it looks good on any device (Windows, Mac, iOS, Android, Linux) */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f7f9fc;
            color: #333333;
            padding: 20px;
        }

        /* Wrapper for the headings */
        .header-container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        /* Main Heading Styling */
        .main-heading {
            /* Responsive font sizing using clamp() so it scales smoothly from mobile to desktop */
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        /* Subheading Styling */
        .sub-heading {
            /* Responsive font sizing */
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 400;
            color: #666666;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="main-heading">Welcome to My Website</h1>
        <p class="sub-heading">This is a responsive subheading that looks great on any screen or browser.</p>
    </div>

</body>
</html>
